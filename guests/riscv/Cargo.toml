[package]
name = "polyisa-guest-riscv"
version = "0.0.0"
license.workspace = true
edition = "2024"
rust-version = "1.99"

[dependencies]
polyisa-bits = { path = "../../crates/bits" }
polyisa-softfloat = { path = "../../crates/softfloat" }
polyisa-decimal = { path = "../../crates/decimal" }
polyisa-mem = { path = "../../crates/mem" }
polyisa-sem = { path = "../../crates/sem" }
polyisa-guest = { path = "../../crates/guest" }
polyisa-timing = { path = "../../crates/timing" }

[build-dependencies]
polyisa-isadl = { path = "../../crates/isadl" }
polyisa-isagen = { path = "../../crates/isagen" }

[dev-dependencies]
polyisa-cli = { path = "../../crates/cli", features = ["guest-riscv"] }
polyisa-isadl = { path = "../../crates/isadl" }
polyisa-engine = { path = "../../crates/engine" }
polyisa-loader = { path = "../../crates/loader" }
polyisa-os-linux = { path = "../../crates/os-linux" }

[lints]
workspace = true
