version: "3"

tasks:
  check:
    desc: "rustfmt、clippy、devtool による規則の検査"
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo run -q -p polyisa-devtool -- check

  check:targets:
    desc: "BE/32bit ターゲットでの cargo check"
    cmds:
      - rustup target list --installed
      - cargo check --workspace --target powerpc64-unknown-linux-gnu
      - cargo check --workspace --target i686-unknown-linux-gnu
      - cargo check --workspace --target wasm32-unknown-unknown
      - cargo check --workspace --target wasm32-wasip1

  refs:check:
    desc: "台帳の検査だけを行う"
    cmds:
      - cargo run -q -p polyisa-devtool -- refs:check

  test:
    desc: "nextest の default プロファイルと doctest"
    cmds:
      - cargo nextest run --profile default --config-file .config/nextest.toml
      - cargo test --doc --workspace

  test:full:
    desc: "オラクルの有無を調べて full プロファイルで実行する"
    vars:
      # 要件が揃わない重いテストバイナリを外すフィルタ式（不足なしは all()）。
      # 外したバイナリと理由は devtool が stderr に「未実行」として出す。
      TEST_FILTER:
        sh: cargo run -q -p polyisa-devtool -- test:plan --filter
    cmds:
      # 結果の末尾に未実行の一覧を出す（nextest が失敗しても出る）。
      - defer: cargo run -q -p polyisa-devtool -- test:plan
      - cargo nextest run --profile full --config-file .config/nextest.toml --cargo-profile heavy -E '{{.TEST_FILTER}}'

  test:layer:
    desc: "重いテストのうち一層だけを実行する"
    vars:
      TEST_FILTER:
        sh: cargo run -q -p polyisa-devtool -- test:plan --filter
    cmds:
      - defer: cargo run -q -p polyisa-devtool -- test:plan
      - cargo nextest run --profile full --config-file .config/nextest.toml --cargo-profile heavy -E 'binary(/^heavy_{{.LAYER}}_/) and ({{.TEST_FILTER}})'
    requires:
      vars: [LAYER]

  testdata:fetch:
    desc: "テストデータを .testdata/ に取得する"
    cmds:
      - cargo run -q -p polyisa-devtool -- testdata:fetch

  isagen:dump:
    desc: "ISADL から生成したコードを書き出す (例: task isagen:dump ISA=riscv)"
    cmds:
      - cargo run -q -p polyisa-devtool -- isagen:dump {{.ISA}}
    requires:
      vars: [ISA]

  status:
    desc: "実装状況を docs/status.md に生成する"
    cmds:
      - cargo run -q -p polyisa-devtool -- status

  status:dump:
    desc: "ISA ごとの命令・モデル詳細を target/status/ に書き出す"
    cmds:
      - cargo run -q -p polyisa-devtool -- status --dump

  bench:
    desc: "性能の計測（汎用意味論と直接実装の比較。背景は docs/architecture/execution.md）"
    cmds:
      - cargo test --release -p polyisa-engine --test bench_generic_direct -- --nocapture

  doctor:
    desc: "外部ツールとターゲットの有無と版を表示する"
    cmds:
      - cargo run -q -p polyisa-devtool -- doctor

  hooks:install:
    desc: "Git の pre-commit フックを入れる"
    cmds:
      - cargo run -q -p polyisa-devtool -- hooks:install

  container:build:
    desc: "検証コンテナイメージ localhost/polyisa-dev をビルドする"
    cmds:
      - podman build --cgroup-manager=cgroupfs -t localhost/polyisa-dev .

  container:
    desc: "検証コンテナ内でコマンドを実行する（例: task container -- task check）"
    deps: [container:build]
    cmds:
      # リポジトリはコンテナ内でも同じ絶対パスに置く。
      # CARGO_MANIFEST_DIR 由来の埋め込みパス（.testdata 参照）が
      # ホスト・コンテナで一致し、target/ も安全に共有できる。
      # keep-id + cap-drop でホストの非特権ユーザーと同じ権限に揃える
      # （busybox テストは権限不足の失敗を検証し、root だと壊れる）。
      # POLYISA_ 系のデバッグ・絞り込み変数はまとめてコンテナに引き継ぐ。
      - >-
        podman run --rm -i --cap-drop=ALL --userns=keep-id
        -v "{{.TASKFILE_DIR}}:{{.TASKFILE_DIR}}" -w "{{.TASKFILE_DIR}}"
        -e RUST_BACKTRACE
        $(env | sed -n 's/^\(POLYISA_[A-Za-z0-9_]*\)=.*/-e \1/p')
        localhost/polyisa-dev {{.CLI_ARGS | default "task --list"}}
