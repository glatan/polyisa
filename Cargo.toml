[workspace]
members = [
    "tools/devtool",
    "crates/bits",
    "crates/testkit",
    "crates/mem",
    "crates/timing",
    "crates/sem",
    "crates/guest",
    "crates/engine",
    "crates/isadl",
    "crates/isagen",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "TBD"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.heavy]
inherits = "release"
debug-assertions = true
overflow-checks = true
