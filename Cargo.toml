[workspace]
members = [
    "tools/devtool",
    "crates/bits",
    "crates/testkit",
    "crates/mem",
    "crates/timing",
    "crates/sem",
    "crates/guest",
    "crates/engine",
    "crates/isadl",
    "crates/isagen",
    "crates/diag",
    "crates/softfloat",
    "crates/decimal",
    "crates/ir",
    "crates/host",
    "crates/loader",
    "crates/kernel",
    "crates/os-linux",
    "crates/os-wasi",
    "crates/trace",
    "crates/gdbstub",
    "crates/cli",
    "crates/jit",
    "guests/aarch64",
    "guests/alpha",
    "guests/arm",
    "guests/riscv",
    "guests/sparc",
    "guests/mips",
    "guests/parisc",
    "guests/x86",
    "guests/wasm",
    "guests/hexagon",
    "guests/ia64",
    "guests/power",
    "guests/s390",
    "guests/m68k",
    "guests/superh",
    "guests/loongarch",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
# 既定は deny。unsafe を許可するクレート（mem, engine, jit, host）は
# クレート側で #![allow(unsafe_code)] を宣言する（docs/design/workspace.md）。
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.heavy]
inherits = "release"
debug-assertions = true
overflow-checks = true
