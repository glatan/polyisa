[workspace]
members = [
    "tools/devtool",
    "crates/bits",
    "crates/testkit",
    "crates/mem",
    "crates/timing",
    "crates/sem",
    "crates/guest",
    "crates/engine",
    "crates/isadl",
    "crates/isagen",
    "crates/diag",
    "crates/softfloat",
    "crates/decimal",
    "crates/ir",
    "crates/host",
    "crates/loader",
    "crates/kernel",
    "crates/os-linux",
    "crates/os-wasi",
    "crates/trace",
    "crates/gdbstub",
    "crates/cli",
    "crates/jit",
    "guests/riscv",
    "guests/sparc",
    "guests/mips",
    "guests/x86",
    "guests/wasm",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.heavy]
inherits = "release"
debug-assertions = true
overflow-checks = true
