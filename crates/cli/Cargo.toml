[package]
name = "polyisa-cli"
version = "0.0.0"
license.workspace = true
edition = "2024"
rust-version = "1.99"

[dependencies]
polyisa-engine = { path = "../engine" }
polyisa-guest = { path = "../guest" }
polyisa-guest-mips = { path = "../../guests/mips" }
polyisa-guest-riscv = { path = "../../guests/riscv" }
polyisa-guest-x86 = { path = "../../guests/x86" }
polyisa-host = { path = "../host" }
polyisa-kernel = { path = "../kernel" }
polyisa-loader = { path = "../loader" }
polyisa-mem = { path = "../mem" }
polyisa-os-linux = { path = "../os-linux", features = ["x86", "riscv"] }
polyisa-sem = { path = "../sem" }
polyisa-trace = { path = "../trace" }

[lints]
workspace = true
