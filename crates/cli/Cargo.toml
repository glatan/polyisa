[package]
name = "polyisa-cli"
version = "0.0.0"
license.workspace = true
edition = "2024"
rust-version = "1.99"

[dependencies]
polyisa-engine = { path = "../engine" }
polyisa-guest = { path = "../guest" }
polyisa-guest-aarch64 = { path = "../../guests/aarch64", optional = true }
polyisa-guest-arm = { path = "../../guests/arm", optional = true }
polyisa-guest-m68k = { path = "../../guests/m68k", optional = true }
polyisa-guest-mips = { path = "../../guests/mips", optional = true }
polyisa-guest-power = { path = "../../guests/power", optional = true }
polyisa-guest-riscv = { path = "../../guests/riscv", optional = true }
polyisa-guest-s390 = { path = "../../guests/s390", optional = true }
polyisa-guest-wasm = { path = "../../guests/wasm", optional = true }
polyisa-guest-x86 = { path = "../../guests/x86", optional = true }
polyisa-host = { path = "../host" }
polyisa-ir = { path = "../ir" }
polyisa-isadl = { path = "../isadl" }
polyisa-jit = { path = "../jit" }
polyisa-kernel = { path = "../kernel" }
polyisa-loader = { path = "../loader" }
polyisa-mem = { path = "../mem" }
polyisa-os-linux = { path = "../os-linux" }
polyisa-os-wasi = { path = "../os-wasi", optional = true }
polyisa-sem = { path = "../sem" }
polyisa-softfloat = { path = "../softfloat" }

[features]
default = [
    "guest-aarch64",
    "guest-arm",
    "guest-m68k",
    "guest-mips",
    "guest-power",
    "guest-riscv",
    "guest-s390",
    "guest-wasm",
    "guest-x86",
]
guest-aarch64 = ["dep:polyisa-guest-aarch64", "polyisa-os-linux/guest-aarch64"]
guest-arm = ["dep:polyisa-guest-arm", "polyisa-os-linux/guest-arm"]
guest-m68k = ["dep:polyisa-guest-m68k", "polyisa-os-linux/guest-m68k"]
guest-mips = ["dep:polyisa-guest-mips", "polyisa-os-linux/guest-mips"]
guest-power = ["dep:polyisa-guest-power", "polyisa-os-linux/guest-power"]
guest-riscv = ["dep:polyisa-guest-riscv", "polyisa-os-linux/guest-riscv"]
guest-s390 = ["dep:polyisa-guest-s390", "polyisa-os-linux/guest-s390"]
guest-wasm = [
    "dep:polyisa-guest-wasm",
    "dep:polyisa-os-wasi",
]
guest-x86 = ["dep:polyisa-guest-x86", "polyisa-os-linux/guest-x86"]

# 各 heavy_* テストは対象ゲストの feature が有効なときだけビルドする。
[[test]]
name = "heavy_program_busybox"
required-features = ["guest-x86"]

[[test]]
name = "heavy_program_busybox_i386"
required-features = ["guest-x86"]

[[test]]
name = "heavy_program_i386_applet_probe"
required-features = ["guest-x86"]

[[test]]
name = "heavy_program_m68k"
required-features = ["guest-m68k"]

[[test]]
name = "heavy_program_mips"
required-features = ["guest-mips"]

[[test]]
name = "heavy_program_aarch64"
required-features = ["guest-aarch64"]

[[test]]
name = "heavy_program_power"
required-features = ["guest-power"]

[[test]]
name = "heavy_program_s390"
required-features = ["guest-s390"]

[[test]]
name = "heavy_jit_diff"
required-features = ["guest-aarch64", "guest-arm", "guest-x86"]

[[test]]
name = "heavy_program_x32"
required-features = ["guest-x86"]

[[test]]
name = "heavy_program_x86ext"
required-features = ["guest-x86"]

[[test]]
name = "heavy_program_wasi"
required-features = ["guest-wasm"]

[[test]]
name = "heavy_diff_wasmtime"
required-features = ["guest-wasm"]

[lints]
workspace = true
