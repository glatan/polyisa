[package]
name = "polyisa-cli"
version = "0.0.0"
license.workspace = true
edition = "2024"
rust-version = "1.99"

[dependencies]
polyisa-engine = { path = "../engine" }
polyisa-gdbstub = { path = "../gdbstub", optional = true }
polyisa-guest = { path = "../guest" }
polyisa-guest-aarch64 = { path = "../../guests/aarch64", optional = true }
polyisa-guest-alpha = { path = "../../guests/alpha", optional = true }
polyisa-guest-arm = { path = "../../guests/arm", optional = true }
polyisa-guest-hexagon = { path = "../../guests/hexagon", optional = true }
polyisa-guest-ia64 = { path = "../../guests/ia64", optional = true }
polyisa-guest-loongarch = { path = "../../guests/loongarch", optional = true }
polyisa-guest-m68k = { path = "../../guests/m68k", optional = true }
polyisa-guest-mips = { path = "../../guests/mips", optional = true }
polyisa-guest-openrisc = { path = "../../guests/openrisc", optional = true }
polyisa-guest-parisc = { path = "../../guests/parisc", optional = true }
polyisa-guest-pdp11 = { path = "../../guests/pdp11", optional = true }
polyisa-guest-power = { path = "../../guests/power", optional = true }
polyisa-guest-riscv = { path = "../../guests/riscv", optional = true }
polyisa-guest-s390 = { path = "../../guests/s390", optional = true }
polyisa-guest-sparc = { path = "../../guests/sparc", optional = true }
polyisa-guest-superh = { path = "../../guests/superh", optional = true }
polyisa-guest-vax = { path = "../../guests/vax", optional = true }
polyisa-guest-wasm = { path = "../../guests/wasm", optional = true }
polyisa-guest-x86 = { path = "../../guests/x86", optional = true }
polyisa-host = { path = "../host" }
polyisa-ir = { path = "../ir" }
polyisa-isadl = { path = "../isadl" }
polyisa-jit = { path = "../jit" }
polyisa-kernel = { path = "../kernel" }
polyisa-loader = { path = "../loader" }
polyisa-mem = { path = "../mem" }
polyisa-os-linux = { path = "../os-linux" }
polyisa-os-v7 = { path = "../os-v7", optional = true }
polyisa-os-bsd = { path = "../os-bsd", optional = true }
polyisa-os-semihost = { path = "../os-semihost", optional = true }
polyisa-os-wasi = { path = "../os-wasi", optional = true }
polyisa-sem = { path = "../sem" }
polyisa-softfloat = { path = "../softfloat" }

[features]
default = [
    "guest-aarch64",
    "guest-alpha",
    "guest-arm",
    "guest-hexagon",
    "guest-ia64",
    "guest-loongarch",
    "guest-m68k",
    "guest-mips",
    "guest-openrisc",
    "guest-parisc",
    "guest-pdp11",
    "guest-power",
    "guest-riscv",
    "guest-s390",
    "guest-sparc",
    "guest-superh",
    "guest-vax",
    "guest-wasm",
    "guest-x86",
]
guest-aarch64 = ["dep:polyisa-guest-aarch64", "polyisa-os-linux/guest-aarch64", "polyisa-os-semihost/guest-aarch64"]
guest-alpha = ["dep:polyisa-guest-alpha", "polyisa-os-linux/guest-alpha"]
guest-arm = ["dep:polyisa-guest-arm", "polyisa-os-linux/guest-arm", "polyisa-os-semihost/guest-arm"]
guest-hexagon = ["dep:polyisa-guest-hexagon", "polyisa-os-linux/guest-hexagon"]
guest-ia64 = ["dep:polyisa-guest-ia64", "polyisa-os-linux/guest-ia64"]
guest-loongarch = ["dep:polyisa-guest-loongarch", "polyisa-os-linux/guest-loongarch"]
guest-m68k = ["dep:polyisa-guest-m68k", "polyisa-os-linux/guest-m68k"]
guest-mips = ["dep:polyisa-guest-mips", "polyisa-os-linux/guest-mips"]
guest-openrisc = ["dep:polyisa-guest-openrisc", "polyisa-os-linux/guest-openrisc"]
guest-parisc = ["dep:polyisa-guest-parisc", "polyisa-os-linux/guest-parisc"]
guest-pdp11 = ["dep:polyisa-guest-pdp11", "dep:polyisa-os-v7"]
guest-power = ["dep:polyisa-guest-power", "polyisa-os-linux/guest-power"]
guest-riscv = ["dep:polyisa-guest-riscv", "polyisa-os-linux/guest-riscv", "dep:polyisa-os-semihost", "dep:polyisa-gdbstub"]
guest-s390 = ["dep:polyisa-guest-s390", "polyisa-os-linux/guest-s390"]
guest-sparc = ["dep:polyisa-guest-sparc", "polyisa-os-linux/guest-sparc"]
guest-superh = ["dep:polyisa-guest-superh", "polyisa-os-linux/guest-superh"]
guest-vax = ["dep:polyisa-guest-vax", "dep:polyisa-os-bsd"]
guest-wasm = [
    "dep:polyisa-guest-wasm",
    "dep:polyisa-os-wasi",
]
guest-x86 = ["dep:polyisa-guest-x86", "polyisa-os-linux/guest-x86"]

# 各 heavy_* テストは対象ゲストの feature が有効なときだけビルドする。
[[test]]
name = "heavy_program_busybox"
required-features = ["guest-x86"]

[[test]]
name = "heavy_program_busybox_i386"
required-features = ["guest-x86"]

[[test]]
name = "heavy_program_i386_applet_probe"
required-features = ["guest-x86"]

[[test]]
name = "heavy_program_m68k"
required-features = ["guest-m68k"]

[[test]]
name = "heavy_program_mips"
required-features = ["guest-mips"]

[[test]]
name = "heavy_program_aarch64"
required-features = ["guest-aarch64"]

[[test]]
name = "heavy_program_power"
required-features = ["guest-power"]

[[test]]
name = "heavy_program_s390"
required-features = ["guest-s390"]

[[test]]
name = "heavy_program_sparc"
required-features = ["guest-sparc"]

[[test]]
name = "heavy_program_alpha"
required-features = ["guest-alpha"]

[[test]]
name = "heavy_program_ia64"
required-features = ["guest-ia64"]

[[test]]
name = "heavy_abi_ia64"
required-features = ["guest-ia64"]

[[test]]
name = "heavy_program_parisc"
required-features = ["guest-parisc"]

[[test]]
name = "heavy_program_superh"
required-features = ["guest-superh"]

[[test]]
name = "heavy_program_loongarch"
required-features = ["guest-loongarch"]

[[test]]
name = "heavy_program_openrisc"
required-features = ["guest-openrisc"]

[[test]]
name = "heavy_program_hexagon"
required-features = ["guest-hexagon"]

[[test]]
name = "heavy_abi_hexagon"
required-features = ["guest-hexagon"]

[[test]]
name = "heavy_jit_diff"
required-features = ["guest-aarch64", "guest-arm", "guest-x86"]

[[test]]
name = "heavy_program_x32"
required-features = ["guest-x86"]

[[test]]
name = "heavy_program_x86ext"
required-features = ["guest-x86"]

[[test]]
name = "heavy_program_gdbstub"
required-features = ["guest-riscv"]

[[test]]
name = "heavy_program_semihosting"
required-features = ["guest-aarch64", "guest-arm", "guest-riscv"]

[[test]]
name = "heavy_program_wasi"
required-features = ["guest-wasm"]

[[test]]
name = "heavy_diff_wasmtime"
required-features = ["guest-wasm"]

[lints]
workspace = true
