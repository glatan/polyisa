[package]
name = "polyisa-os-linux"
version = "0.0.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
polyisa-kernel = { path = "../kernel" }
polyisa-loader = { path = "../loader" }
polyisa-engine = { path = "../engine" }
polyisa-guest = { path = "../guest" }
polyisa-host = { path = "../host" }
polyisa-mem = { path = "../mem" }
polyisa-sem = { path = "../sem" }
polyisa-guest-aarch64 = { path = "../../guests/aarch64", optional = true }
polyisa-guest-alpha = { path = "../../guests/alpha", optional = true }
polyisa-guest-arm = { path = "../../guests/arm", optional = true }
polyisa-guest-hexagon = { path = "../../guests/hexagon", optional = true }
polyisa-guest-ia64 = { path = "../../guests/ia64", optional = true }
polyisa-guest-loongarch = { path = "../../guests/loongarch", optional = true }
polyisa-guest-m68k = { path = "../../guests/m68k", optional = true }
polyisa-guest-mips = { path = "../../guests/mips", optional = true }
polyisa-guest-openrisc = { path = "../../guests/openrisc", optional = true }
polyisa-guest-parisc = { path = "../../guests/parisc", optional = true }
polyisa-guest-power = { path = "../../guests/power", optional = true }
polyisa-guest-riscv = { path = "../../guests/riscv", optional = true }
polyisa-guest-s390 = { path = "../../guests/s390", optional = true }
polyisa-guest-sparc = { path = "../../guests/sparc", optional = true }
polyisa-guest-superh = { path = "../../guests/superh", optional = true }
polyisa-guest-x86 = { path = "../../guests/x86", optional = true }

[features]
guest-aarch64 = ["dep:polyisa-guest-aarch64"]
guest-alpha = ["dep:polyisa-guest-alpha"]
guest-arm = ["dep:polyisa-guest-arm"]
guest-hexagon = ["dep:polyisa-guest-hexagon"]
guest-ia64 = ["dep:polyisa-guest-ia64"]
guest-loongarch = ["dep:polyisa-guest-loongarch"]
guest-m68k = ["dep:polyisa-guest-m68k"]
guest-mips = ["dep:polyisa-guest-mips"]
guest-openrisc = ["dep:polyisa-guest-openrisc"]
guest-parisc = ["dep:polyisa-guest-parisc"]
guest-power = ["dep:polyisa-guest-power"]
guest-riscv = ["dep:polyisa-guest-riscv"]
guest-s390 = ["dep:polyisa-guest-s390"]
guest-sparc = ["dep:polyisa-guest-sparc"]
guest-superh = ["dep:polyisa-guest-superh"]
guest-x86 = ["dep:polyisa-guest-x86"]

[lints]
workspace = true
